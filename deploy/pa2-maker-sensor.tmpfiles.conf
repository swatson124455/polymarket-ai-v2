# tmpfiles.d entry for the Maker sensor feed: the unit's file-granular
# ReadWritePaths needs /opt/pa2-maker-feeds/informed_flow.jsonl to exist
# BEFORE the mount namespace binds (ExecStartPre runs too late). Install to
# /etc/tmpfiles.d/pa2-maker-sensor.conf; applied at boot and by
# `systemd-tmpfiles --create`.
f /opt/pa2-maker-feeds/informed_flow.jsonl 0644 polymarket polymarket -
