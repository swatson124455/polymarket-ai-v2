# A2 gate (blind-review 2026-09-06): a bare `systemctl start` used to bypass
# kalshi_preflight.py entirely. This drop-in makes the unit itself run the hard
# checks (sudo-safe STOP, 25-key rails manifest, config-change guard w/ ack,
# fresh account read) before every start and refuse the start on any FAIL.
# The advisory dry-selection print is skipped in this mode (--pre-start).
# Install path:
#   /etc/systemd/system/polymarket-maker-kalshi-ws.service.d/10-preflight-gate.conf
# then: systemctl daemon-reload
# EnvironmentFile + WorkingDirectory from the main unit apply to ExecStartPre.
# StartLimit: without it, Restart=always + a FAILing gate = an infinite
# activating-loop every RestartSec (observed live 2026-09-06 15:39Z on the
# refused-start test). Burst 3 / 60s: a refused start (or a crash-looping
# daemon) goes to 'failed' within ~1 min instead of looping forever —
# fail-closed for a trading bot. A single transient crash still restarts.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=3

[Service]
ExecStartPre=/opt/pa2-maker-kalshi-live/venv/bin/python /opt/pa2-maker-kalshi-live/kalshi_preflight.py --pre-start
